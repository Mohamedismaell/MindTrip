name: mindtrip
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  meta: ^1.16.0
  get_it: ^9.0.5
  cupertino_icons: ^1.0.8
  lottie: ^3.3.2
  go_router: ^17.0.0
  device_preview: ^1.3.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  animations: ^2.1.1
  equatable: ^2.0.8
  glaze_nav_bar: ^1.2.1
  shimmer: ^3.0.0
  connectivity_plus: ^7.0.0
  hive_ce_flutter: ^2.3.4
  internet_connection_checker_plus: ^2.9.1+2
  skeletonizer: ^2.1.2
  hydrated_bloc: ^10.1.1
  path_provider: ^2.1.5
  smooth_page_indicator: ^2.0.1
  flutter_secure_storage: ^9.2.4
  #social auth
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.5
  #image
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  flutter_image_compress: ^2.4.0
  curved_labeled_navigation_bar: ^2.0.6
  mapbox_maps_flutter: ^2.22.0
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  build_runner: ^2.11.0
  hive_ce_generator: ^1.11.1

flutter_launcher_icons:
  android: true
  ios: true
  # for iOS + fallback
  image_path: "assets/images/splash/Frame 3.png"

  # for Android adaptive icon
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/splash/Frame 3.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/splash/logo_no_ground.png
  android: true
  ios: true

  android_12:
    color: "#ff ffff"
    image: assets/images/splash/logo_no_ground.png

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/splash/
    - assets/images/onboarding/
    - assets/images/authentication/
    - assets/images/animation/
    - assets/images/profile/
    - assets/images/map/
    - assets/images/ai_planner/
    - assets/icons/
    - assets/icons/home/
    - assets/icons/profile/
    - assets/icons/explore/
    - assets/icons/bottom_nav/
    - assets/icons/ai_planner/
  fonts:
    - family: SFPro
      fonts:
        - asset: assets/fonts/SFProText/SF-Pro-Display-Light.otf
          weight: 300
        - asset: assets/fonts/SFProText/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SFProText/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SFProText/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SFProText/SF-Pro-Display-Bold.otf
          weight: 700
